  <div class="container">
    <div class="chat-header">
      <h1>🌸 Waifu Chat Simulator</h1>
      <div class="dere-controls">
        <select id="dereType">
          <option value="tsundere">Tsundere</option>
          <option value="yandere">Yandere</option>
          <option value="dandere">Dandere</option>
          <option value="kuudere">Kuudere</option>

      <div class="chat-messages" id="chatMessages"></div>

        <input type="text" id="userInput" placeholder="Type your message...">
        <button id="sendButton">Send</button>
      </div>
    </div>
  </div>

      <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">

        <stop offset="100%" style="stop-color: #c77dff; stop-opacity: 0.2" />

    </defs>
    <rect width="100%" height="100%" fill="url(#bgGradient)" />
