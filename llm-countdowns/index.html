  <style>
    /* Top Ecosystem Bar */
    .ecosystem-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 16px;
      background: rgba(13, 19, 31, 0.95);
      border-bottom: 1px solid var(--border-color);
      font-size: 12px;
      font-weight: 600;
    }
    .ecosystem-backlink {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-cyan);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .ecosystem-backlink:hover {
      color: #fff;
      text-decoration: underline;
    }
    .ecosystem-badges {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ecosystem-badge-tag {
      background: rgba(0, 242, 254, 0.1);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 242, 254, 0.25);
      border-radius: var(--radius-full);
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .btn-header-action {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.15) 0%, rgba(79, 172, 254, 0.2) 100%);
      border: 1px solid rgba(0, 242, 254, 0.4);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-header-action:hover {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.25) 0%, rgba(79, 172, 254, 0.35) 100%);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- Ecosystem Nav Bar -->
  <div class="ecosystem-nav-bar">
    <a href="../" class="ecosystem-backlink">
      <span>←</span>
      <span>WaifuAI Docs Hub</span>
    </a>
    <div class="ecosystem-badges">
      <span class="ecosystem-badge-tag">⚡ LLM COUNTDOWNS</span>
      <span class="ecosystem-badge-tag" style="border-color: rgba(0, 230, 118, 0.3); color: var(--accent-green);">LAUNCH RADAR</span>
    </div>
  </div>

  <!-- Top Application Bar -->
  <header class="app-header">
    <div class="header-top">
      <div class="brand-wrapper">
        <div class="brand-icon">⚡</div>
        <div class="brand-title-wrap">
          <h1>LLM COUNTDOWNS</h1>
          <div class="brand-subtitle">
            <span>Frontier Model Launch Clocks</span> • <span id="header-last-updated">Forecasts: Sept 2026</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-add-countdown-header" class="btn-header-action" title="Add Custom Release Estimate">
          <span>+ Add Estimate</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Container: Release Radar & Countdowns -->
  <main class="app-main" style="padding-top: 16px;">
    <section id="tab-countdowns" class="tab-content active">
      <!-- Dynamically injected and updated by countdowns.js -->
    </section>
  </main>

  <!-- Add Custom Countdown Modal -->
  <div id="add-countdown-modal" class="modal-overlay">
    <div class="modal-drawer">
      <div class="drawer-handle"></div>
      <div class="drawer-header">
        <div>
          <div class="drawer-title">Add Release Estimate</div>
          <div class="brand-subtitle" style="margin-top: 4px;">Track upcoming frontier models or custom launches</div>
        </div>
        <button class="drawer-close" aria-label="Close modal">✕</button>
      </div>

      <form id="form-add-countdown" class="custom-countdown-form">
        <div class="form-group">
          <label class="form-label" for="custom-countdown-name">Model Name *</label>
          <input type="text" id="custom-countdown-name" class="search-input" placeholder="e.g. Claude 6 Opus, GPT-7 Orion..." required>
        </div>

        <div class="form-row">
          <div class="form-group" style="flex: 1;">
            <label class="form-label" for="custom-countdown-creator">Lab / Creator *</label>
            <input type="text" id="custom-countdown-creator" class="search-input" placeholder="e.g. Anthropic, OpenAI, xAI" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label class="form-label" for="custom-countdown-confidence">Confidence</label>
            <select id="custom-countdown-confidence" class="sort-select" style="width: 100%; height: 42px;">
              <option value="High">High Confidence</option>
              <option value="Medium" selected>Medium Confidence</option>
              <option value="Speculative">Speculative / Rumor</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group" style="flex: 1;">
            <label class="form-label" for="custom-countdown-date">Estimated Date *</label>
            <input type="date" id="custom-countdown-date" class="search-input" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label class="form-label" for="custom-countdown-label">Target Window Label</label>
            <input type="text" id="custom-countdown-label" class="search-input" placeholder="e.g. Late Oct 2026">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="custom-countdown-features">Expected Breakthroughs / Rumored Specs</label>
          <input type="text" id="custom-countdown-features" class="search-input" placeholder="e.g. 10M context, 95% SWE-bench (comma separated)">
        </div>

        <div class="form-group">
          <label class="form-label" for="custom-countdown-source">Source / Citation</label>
          <input type="text" id="custom-countdown-source" class="search-input" placeholder="e.g. Keynote hint, cluster training reports">
        </div>

        <button type="submit" class="filter-chip active" style="margin-top: 8px; width: 100%; padding: 12px; font-weight: 700; font-size: 13px;">
          🚀 Save &amp; Start Countdown
        </button>
      </form>
    </div>
  </div>

  <!-- Purely Static Logic -->
  <script src="countdowns.js"></script>
  <script src="app.js"></script>
</body>
</html>
