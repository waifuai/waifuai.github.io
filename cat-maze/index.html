<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Maze — Retro Puzzle Web Game | WaifuAI</title>
    <meta name="description" content="Play Cat Maze: A client-side retro puzzle maze game with 30 handcrafted levels, an interactive level editor, ice sliding, keys and doors, and dynamic sound.">
    <link rel="canonical" href="https://waifuai.github.io/cat-maze/">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EP9DHGYS02"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-EP9DHGYS02');
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link rel="stylesheet" href="src/styles/styles.css">
</head>
<body>
    <div id="main-layout">
        <header id="header">
            <div style="display: flex; align-items: center; gap: 14px;">
                <a href="../" style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px; background: var(--button-bg); border: 1px solid var(--border-color); color: var(--text-color); text-decoration: none; font-size: 0.85rem; font-weight: 600; transition: all 0.2s ease;">&larr; WaifuAI Hub</a>
                <h1 style="margin: 0;">Cat Maze</h1>
            </div>
            <div>
                <button id="toggle-editor">Toggle Editor</button>
                <button id="show-tutorial">Tutorial</button>
                <button id="toggle-theme" title="Toggle theme">☀️ Light</button>
            </div>
        </header>

        <div id="game-area">
            <div id="game-section">
                <div id="game-container">
                    <div id="status-area">
                        <span id="level-status">Level: 1</span>
                        <span id="fishes-status">Fishes: 0 / 0</span>
                        <span id="boots-status">Boots: None</span>
                        <span id="keys-status">Keys: (0)</span>
                    </div>

                    <div id="board-viewport">
                        <div id="game-board">
                            <!-- Game board tiles will be generated by script.js -->
                        </div>
                    </div>

                    <div id="message-box">Loading... (Click or press key to enable sound)</div>

                    <div id="bottom-controls">
                        <div id="controls">
                            <button id="btn-up">⬆️</button>
                            <button id="btn-left">⬅️</button>
                            <button id="btn-reset-view">🔄</button>
                            <button id="btn-toggle-map-view">🗺️</button>
                            <button id="btn-down">⬇️</button>
                            <button id="btn-right">➡️</button>
                            <button id="btn-zoom-in">+</button>
                            <button id="btn-zoom-out">-</button>
                        </div>
                    </div>
                </div>

                <div id="editor-container" style="display: none;">
                    <h2>Map Editor</h2>
                    <div id="editor-toolbar">
                        <span>Brush:</span>
                        <button class="tool-button" data-tile="0">Empty</button>
                        <button class="tool-button" data-tile="1">Wall 🧱</button>
                        <button class="tool-button" data-tile="2">Fish 🐟</button>
                        <button class="tool-button" data-tile="3">Water 💧</button>
                        <button class="tool-button" data-tile="4">Fire 🔥</button>
                        <button class="tool-button" data-tile="8">Ice 🧊</button>
                        <button class="tool-button" data-tile="5">Key 🔑</button>
                        <button class="tool-button" data-tile="6">Door 🚪</button>
                        <button class="tool-button" data-tile="B">Blue Key 🔵</button>
                        <button class="tool-button" data-tile="C">Blue Door 🚪</button>
                        <button class="tool-button" data-tile="D">Yellow Key 🟡</button>
                        <button class="tool-button" data-tile="E">Yellow Door 🚪</button>
                        <button class="tool-button" data-tile="F">Green Key 🟢</button>
                        <button class="tool-button" data-tile="G">Green Door 🚪</button>
                        <button class="tool-button" data-tile="9">Flippers 🤿</button>
                        <button class="tool-button" data-tile="A">Boots 🥾</button>
                        <button class="tool-button" data-tile="P">Player 🐈</button>
                        <button class="tool-button" data-tile="7">Exit 🏁</button>
                    </div>
                    <div id="editor-board-viewport"></div>
                    <div id="editor-controls">
                        <label>Rows: <input type="number" id="editor-rows" min="5" max="50" value="10"></label>
                        <label>Cols: <input type="number" id="editor-cols" min="5" max="50" value="10"></label>
                        <button id="editor-resize">Resize (Clears Board)</button>
                        <button id="editor-export">Export JSON</button>
                        <button id="editor-load-current">Load Current Level</button>
                        <span id="editor-brush-indicator">Selected: Empty</span>
                    </div>
                </div>
            </div>

            <div id="level-sidebar">
                <div id="level-menu">
                    <!-- Level selection buttons will be generated by script.js -->
                </div>
            </div>
        </div>
    </div>

    <!-- Tutorial Overlay -->
    <div id="tutorial-overlay" style="display: none;">
        <div id="tutorial-content">
            <h2>Welcome to Cat Maze!</h2>
            <div id="tutorial-step"></div>
            <div id="tutorial-controls">
                <button id="tutorial-prev">Previous</button>
                <button id="tutorial-next">Next</button>
                <button id="tutorial-skip">Skip Tutorial</button>
            </div>
        </div>
    </div>

    <script type="module" src="src/js/main.js"></script>
</body>
</html>
